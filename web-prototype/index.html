<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Brumeval</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: plein écran, monde en canvas pixel (384x216) mis à l'échelle, HUD et menus en DOM par-dessus. Univers unique sombre et brumeux. */
:root{
  --night:#0d1219; --ink:#ece4cf; --ink-dim:#a89f8a;
  --brass:#d29a45; --brass-dk:#6e4519; --wood:#3a2616; --wood-lt:#5a3c22;
  --mist:#7cc4cf; --teal:#1d4b52; --teal-lt:#2d6a72;
  --hp:#d4483b; --xp:#7cc4cf; --ok:#8fc25a; --bad:#e0604f;
  --f-disp:'Silkscreen','Courier New',monospace;
  --f-ui:'Pixelify Sans',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ink);font-family:var(--f-ui);font-size:16px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
button{font-family:var(--f-ui);font-size:15px;color:var(--ink);cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--mist);outline-offset:2px}
.btn{display:block;width:100%;padding:7px 12px;background:var(--teal);border:2px solid var(--brass);border-bottom-width:4px;box-shadow:inset 0 0 0 2px #0e2a2f;text-align:center;letter-spacing:.03em;transition:background .1s}
.btn:hover:not([disabled]){background:var(--teal-lt)}
.btn:active:not([disabled]){border-bottom-width:2px;transform:translateY(2px)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.sm{display:inline-block;width:auto;padding:4px 10px;font-size:14px}
.btn.alt{background:var(--wood-lt)}
.frame{background:var(--wood);border:3px solid var(--brass-dk);box-shadow:0 0 0 2px var(--brass),0 8px 0 rgba(0,0,0,.45);padding:14px}
.frame h2{font-family:var(--f-disp);font-size:18px;margin:0 0 10px;color:var(--brass);letter-spacing:.04em;text-wrap:balance}
.frame h3{font-family:var(--f-disp);font-size:14px;margin:12px 0 6px;color:var(--mist)}
.frame p{margin:0 0 8px;line-height:1.4}
.muted{color:var(--ink-dim)}
/* Title */
#title{position:absolute;inset:0;overflow:auto;background:radial-gradient(ellipse at 50% 30%,rgba(13,18,25,.35),rgba(13,18,25,.88));padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.t-wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr minmax(240px,300px) 1fr;gap:20px;align-items:start}
.t-head{grid-column:1/-1;text-align:center;padding-top:8px}
.logo{font-family:var(--f-disp);font-weight:700;font-size:clamp(36px,8vw,72px);line-height:1;color:var(--mist);letter-spacing:.06em;text-shadow:0 4px 0 #1d4b52,0 0 24px rgba(124,196,207,.45);margin:0}
.tag{font-family:var(--f-disp);color:var(--brass);font-size:13px;margin-top:8px;letter-spacing:.12em}
.demo-line{color:var(--brass);font-size:13px;margin-bottom:8px}
.t-menu{display:flex;flex-direction:column;gap:7px}
.t-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.notes ul{margin:0;padding-left:18px;line-height:1.45;font-size:14px}
.lang{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px}
select,input[type=text]{font-family:var(--f-ui);font-size:15px;background:#12262a;color:var(--ink);border:2px solid var(--brass);padding:4px 6px}
.tierchip{display:inline-block;font-family:var(--f-disp);font-size:11px;padding:2px 6px;border:1px solid var(--brass);color:var(--brass);margin-right:4px}
@media (max-width:820px){.t-wrap{grid-template-columns:1fr}.t-menu{order:1}.t-side{order:2}.t-side.left{order:3}}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;font-size:14px}
.hud-l{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;width:210px;background:rgba(20,14,9,.78);border:2px solid var(--brass-dk);padding:7px 8px;display:flex;flex-direction:column;gap:4px}
.who{font-family:var(--f-disp);font-size:12px;color:var(--brass)}
.bar{position:relative;height:12px;background:#1a1410;border:1px solid #000}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--hp)}
.bar.xp i{background:var(--xp)}
.bar b{position:absolute;inset:0;font-weight:400;font-size:11px;line-height:12px;text-align:center;color:#fff;text-shadow:1px 1px 0 #000;font-variant-numeric:tabular-nums}
.hrow{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
#hState{color:var(--mist);font-size:13px;min-height:1em}
.hud-r{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;width:230px;background:rgba(20,14,9,.78);border:2px solid var(--brass-dk);padding:7px 8px}
.q-title{font-family:var(--f-disp);font-size:11px;color:var(--brass);margin-bottom:3px}
#hQ{line-height:1.3}
#hQ .ready{color:var(--ok)}
.hud-b{position:absolute;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom,0px));background:rgba(20,14,9,.7);padding:4px 10px;border:1px solid var(--brass-dk);font-size:13px;white-space:nowrap;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis}
@media (max-width:600px){.hud-l{width:160px;font-size:12px}.hud-r{width:150px;font-size:12px}.hud-b{display:none}}
/* Panel */
#panel{position:absolute;inset:0;background:rgba(5,8,12,.55);display:flex;align-items:center;justify-content:center;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#pbox{width:min(560px,100%);max-height:100%;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 8px;background:rgba(0,0,0,.25);border:1px solid var(--brass-dk)}
.item .nm{min-width:0}
.item .acts{display:flex;gap:6px;flex-shrink:0}
.cost{font-size:13px;color:var(--ink-dim)}
.cost .no{color:var(--bad)}
.dlg-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.portrait{width:48px;height:48px;image-rendering:pixelated;background:#12262a;border:2px solid var(--brass);flex-shrink:0}
.hearts{color:var(--hp);font-size:13px;letter-spacing:1px}
.say{background:rgba(0,0,0,.3);border-left:3px solid var(--mist);padding:8px 10px;margin-bottom:10px;line-height:1.4}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.keys kbd{font-family:var(--f-disp);font-size:11px;background:#12262a;border:1px solid var(--brass);padding:1px 5px;white-space:nowrap}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tier{background:rgba(0,0,0,.28);border:1px solid var(--brass-dk);padding:8px}
.tier b{font-family:var(--f-disp);font-size:12px;color:var(--brass);display:block}
.tier .pr{color:var(--mist);font-size:13px}
.tier ul{margin:6px 0 0;padding-left:16px;font-size:13px;line-height:1.35}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed rgba(210,154,69,.25)}
.mapc{width:100%;image-rendering:pixelated;border:2px solid var(--brass-dk);background:#000}
/* Toasts */
#toasts{position:absolute;left:50%;top:64px;transform:translateX(-50%);display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none;width:min(420px,calc(100% - 32px))}
.toast{background:rgba(20,14,9,.9);border:1px solid var(--brass);padding:4px 10px;font-size:14px;animation:tin .2s ease-out;text-align:center}
.toast.good{border-color:var(--ok)}.toast.bad{border-color:var(--bad)}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.btn{transition:none}}
/* Touch */
#touch{position:absolute;inset:0;pointer-events:none}
#stick{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(210,154,69,.5);pointer-events:auto}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(124,196,207,.45)}
.tbtns{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,52px);gap:8px;pointer-events:auto}
.tbtns button{width:52px;height:52px;border-radius:50%;background:rgba(29,75,82,.75);border:2px solid var(--brass);font-family:var(--f-disp);font-size:12px}
</style>

<div id="app">
  <canvas id="cv" width="384" height="216" aria-label="Brumeval"></canvas>

  <div id="hud" hidden>
    <div class="hud-l">
      <div class="who" id="hLv"></div>
      <div class="bar hp"><i id="hHp"></i><b id="hHpT"></b></div>
      <div class="bar xp"><i id="hXp"></i><b id="hXpT"></b></div>
      <div class="hrow"><span id="hGold"></span><span id="hDay"></span></div>
      <div id="hState"></div>
    </div>
    <div class="hud-r"><div class="q-title" id="hQT"></div><div id="hQ"></div></div>
    <div class="hud-b" id="hHint"></div>
  </div>

  <div id="title">
    <div class="t-wrap">
      <div class="t-head">
        <div class="demo-line" data-i="demoLine"></div>
        <h1 class="logo">BRUMEVAL</h1>
        <div class="tag" data-i="tagline"></div>
      </div>
      <div class="t-side left">
        <div class="frame notes">
          <h2 data-i="notesTitle"></h2>
          <p class="muted" style="font-size:13px">0.1.0 · 29/10/2026</p>
          <ul id="notesList"></ul>
        </div>
      </div>
      <div class="frame t-menu" id="tMenu">
        <button class="btn" data-act="continue" id="bCont" data-i="continue"></button>
        <button class="btn" data-act="new" data-i="newGame"></button>
        <button class="btn" data-act="load" data-i="load"></button>
        <button class="btn" data-act="settings" data-i="settings"></button>
        <button class="btn" data-act="controls" data-i="controls"></button>
        <button class="btn alt" data-act="patreon" data-i="support"></button>
        <button class="btn" data-act="credits" data-i="credits"></button>
        <div class="lang">
          <label for="langSel" data-i="language"></label>
          <select id="langSel"><option value="fr">Français</option><option value="en">English</option></select>
        </div>
      </div>
      <div class="t-side">
        <div class="frame">
          <h2 data-i="supportTitle"></h2>
          <p data-i="supportPitch"></p>
          <p class="muted" style="font-size:13px" id="tierNow"></p>
          <button class="btn alt" data-act="patreon" data-i="seeTiers"></button>
        </div>
      </div>
    </div>
  </div>

  <div id="panel" hidden><div class="frame" id="pbox"></div></div>
  <div id="toasts" aria-live="polite"></div>

  <div id="touch" hidden>
    <div id="stick"><div id="knob"></div></div>
    <div class="tbtns">
      <button data-k="KeyB">B</button><button data-k="KeyI">I</button><button data-k="Escape">II</button>
      <button data-k="KeyR">R</button><button data-k="KeyE">E</button><button data-k="Space" id="tAtk">⚔</button>
    </div>
  </div>
</div>

  const b=biome(x,y),n=nz(x/MW,y/MH),n2=nz2(x/MW,y/MH),dv=Math.hypot(x-VX,y-VY);
  let tl=(b==='plain'&&r()<.07)?T.FLOWER:T.GRASS;
  if(b==='crypt'){m[y*MW+x]=T.GRASS;continue}
  const wth=b==='marsh'?.57:.7;
  if(dv>9&&n>wth)tl=T.WATER;
  else if(dv>8){const tp=b==='forest'?.3:b==='marsh'?.06:(n2>.62?.2:.035),q=r();if(q<tp)tl=T.TREE;else if(q<tp+(b==='forest'?.03:.022))tl=T.ROCK}

  m[y*MW+x]=tl;
 }
 const set=(x,y)=>{const i=y*MW+x,c=m[i];if(c===T.WALL||c===T.GATE)return;m[i]=c===T.WATER?T.BRIDGE:T.PATH};
 const path=(x0,y0,x1,y1)=>{let x=x0,y=y0;while(x!==x1){set(x,y);x+=Math.sign(x1-x)}while(y!==y1){set(x,y);y+=Math.sign(y1-y)}set(x,y)};
 // camp gobelin dégagé
 for(let y=40;y<=48;y++)for(let x=26;x<=34;x++)if(Math.hypot(x-30,y-44)<4.5)m[y*MW+x]=T.GRASS;
 // crypte
 for(let y=1;y<=10;y++)for(let x=59;x<=70;x++)m[y*MW+x]=(x===59||x===70||y===1||y===10)?T.WALL:T.CRYPT;
 m[10*MW+65]=T.GATE;
 path(VX,VY,62,VY);path(VX,VY,VX,4);path(VX,VY,VX,MH-4);path(VX,VY+8,30,VY+8);path(30,VY+8,30,40);path(52,VY,52,46);path(62,VY,65,VY);path(65,VY,65,11);path(VX,6,44,6);
 for(let y=VY-3;y<=VY+3;y++)for(let x=VX-3;x<=VX+3;x++)m[y*MW+x]=T.PATH;

 G=newState(seed);
 addNpc({kind:'elder',name:'elder',x:(VX-1)*TS,y:(VY-1)*TS});
 addNpc({kind:'trader',name:'trader',x:(VX+3)*TS,y:(VY-2)*TS});
 for(let i=0;i<3;i++)addVillager();
 G.ents.push(mkMon('chef',6,30*TS+8,44*TS+8,1));
 G.ents.push({kind:'tent',x:28*TS,y:43*TS},{kind:'tent',x:32*TS+8,y:42*TS+8},{kind:'tent',x:31*TS,y:46*TS+6});
 fillSpawns(true);
 G.qbase=QDEF[0].v();
}
function addNpc(o){const e=Object.assign({hp:40,maxhp:40,atk:4,anim:0,dir:{x:0,y:1},wt:0,mv:{x:0,y:0},hx:o.x,hy:o.y,aff:0,talks:0,gifts:0},o);G.ents.push(e);return e}
function addVillager(at){
 const used=G.ents.filter(e=>e.kind==='villager').map(e=>e.name),free=VNAMES.filter(n=>!used.includes(n));if(!free.length)return null;
 const n=free[rint(0,free.length-1)],c=VCOL[rint(0,VCOL.length-1)];
 const x=at?at.x:(VX+rnd(-4,4))*TS,y=at?at.y:(VY+rnd(-4,4))*TS;
 return addNpc({kind:'villager',name:n,tunic:c[0],hair:c[1],x,y,hx:x,hy:y,follow:false,spouse:false,seed:Math.random()*9});
}
function mkMon(kind,lvl,x,y,zone){const d=MON[kind],k=1+.25*(lvl-1);return{kind,lvl,x,y,hx:x,hy:y,zone,hp:Math.round(d.hp*k),maxhp:Math.round(d.hp*k),atk:Math.round(d.atk*(1+.18*(lvl-1))),spd:d.spd,cd:0,anim:Math.random()*5,dir:{x:1,y:0},wt:0,mv:{x:0,y:0},prov:0,hitT:0,seed:Math.random()*9,ally:false}}
function countB(k){return G.buildings.filter(b=>b.k===k).length}

// ================= Collisions =================
function gateOpen(){return S.tier>=2}
function solidT(tx,ty,fly){if(tx<0||ty<0||tx>=MW||ty>=MH)return true;const c=G.map[ty*MW+tx];if(G.bgrid[ty*MW+tx])return true;if(c===T.WATER)return!fly;if(c===T.GATE)return!gateOpen();return c===T.TREE||c===T.ROCK||c===T.WALL}
function canAt(x,y,fly){const xs=[x-4,x+3],ys=[y-3,y];for(const a of xs)for(const b of ys)if(solidT(Math.floor(a/TS),Math.floor(b/TS),fly))return false;return true}
function moveE(e,dx,dy,fly){if(canAt(e.x+dx,e.y,fly))e.x+=dx;if(canAt(e.x,e.y+dy,fly))e.y+=dy}

// ================= Joueur =================
const P=()=>G.player;
function maxHp(){const p=P();return 60+12*(p.lvl-1)}
function atkP(){const p=P();if(p.body)return p.body.atk;return 4+2*(p.lvl-1)+(p.sword?4:0)+(p.relic?5:0)}
function defP(){const p=P();if(p.body)return 0;return(p.armor?2:0)+(p.spouse?1:0)}
function spdP(){const p=P();if(p.body)return Math.min(95,MON[p.body.kind].spd*1.5);return 62}
function xpNeed(l){return Math.round(20*Math.pow(l,1.5))}
function diffMul(){return S.diff==='easy'?.6:S.diff==='hard'?1.4:1}
function isNight(){return darkness()>.3}
function darkness(){const d=Math.cos(G.time*Math.PI*2);let v=clamp((d+.25)*.62,0,.74);const p=P();if(biome(Math.floor(p.x/TS),Math.floor(p.y/TS))==='crypt')v=Math.max(v,.62);return v}
function friendly(e){const p=P(),f=FACTION[e.kind];if(e.prov>0)return false;if(p.body&&FACTION[p.body.kind]===f)return true;if(p.mask&&MASKF[p.mask]===f)return true;return false}
function addXP(n){const p=P();if(S.tier>=3)n=Math.round(n*1.1);p.xp+=n;while(p.xp>=xpNeed(p.lvl)){p.xp-=xpNeed(p.lvl);p.lvl++;p.hp=maxHp();toast(t('levelUp',p.lvl),'good');SND.lvl();burst(p.x,p.y-8,'#ffe27a',14)}}
function give(k,n=1){const p=P();if(k==='gold'){p.gold+=n;return}p.inv[k]=(p.inv[k]||0)+n;if(MASKF[k])G.stats.masks++}
function has(need){const p=P();return Object.entries(need).every(([k,v])=>(k==='gold'?p.gold:(p.inv[k]||0))>=v)}
function take(need){const p=P();for(const[k,v]of Object.entries(need)){if(k==='gold')p.gold-=v;else{p.inv[k]-=v;if(!p.inv[k])delete p.inv[k]}}}

function updatePlayer(dt){
 const p=P();p.atkCd-=dt;p.swing-=dt;p.hurtT-=dt;
 if(p.dead>0){p.dead-=dt;if(p.dead<=0)respawn();return}
 let ix=0,iy=0;
 if(keys.has('KeyA')||keys.has('ArrowLeft'))ix--;if(keys.has('KeyD')||keys.has('ArrowRight'))ix++;
 if(keys.has('KeyW')||keys.has('ArrowUp'))iy--;if(keys.has('KeyS')||keys.has('ArrowDown'))iy++;
 ix+=touchVec.x;iy+=touchVec.y;
 const l=Math.hypot(ix,iy);p.moving=l>.15;
 if(p.moving){ix/=Math.max(1,l);iy/=Math.max(1,l);const sp=spdP()*dt;moveE(p,ix*sp,iy*sp,p.body&&MON[p.body.kind].fly);p.anim+=dt;if(Math.abs(ix)>Math.abs(iy))p.dir={x:Math.sign(ix),y:0};else p.dir={x:0,y:Math.sign(iy)}}
 if((keys.has('Space')||keys.has('KeyJ'))&&!G.placing)playerAttack();
 // feu de camp : soin
 if(!p.body)for(const b of G.buildings)if(b.k==='campfire'&&Math.hypot(b.cx-p.x,b.cy-p.y)<40){p.hp=Math.min(maxHp(),p.hp+4*dt)}
 if(p.spouse&&!p.body)p.hp=Math.min(maxHp(),p.hp+.5*dt);
}
function playerAttack(){
 const p=P();if(p.atkCd>0||p.dead>0)return;p.atkCd=.36;p.swing=.14;SND.swing();
 const hx=p.x+p.dir.x*12,hy=p.y-5+p.dir.y*12;let hit=false;
 for(const e of G.ents){if(!MON[e.kind]||e.ally||e.dead)continue;if(Math.hypot(e.x-hx,(e.y-6)-hy)<14){hit=true;
   const f=FACTION[e.kind];if(friendly(e)){let any=false;for(const o of G.ents)if(MON[o.kind]&&!o.ally&&FACTION[o.kind]===f&&dist(o,e)<110){o.prov=10;any=true}if(any)toast(t('maskBroken'),'bad')}
   damageE(e,Math.max(1,Math.round(atkP()*rnd(.85,1.15))),p)}}
 if(!hit)hitTile(Math.floor(hx/TS),Math.floor((hy+3)/TS));
}
function hitTile(tx,ty){
 if(tx<0||ty<0||tx>=MW||ty>=MH)return;const i=ty*MW+tx,c=G.map[i],p=P();
 if(c!==T.TREE&&c!==T.ROCK)return;
 if(p.body){toast(t('cantHere'));return}
 const hp=(G.thp[i]??(c===T.TREE?3:4))-1;G.thp[i]=hp;SND.chop();G.shake=.06;
 const cx=tx*TS+8,cy=ty*TS+8;burst(cx,cy,c===T.TREE?'#7a5a2a':'#9a9aa2',5);
 if(c===T.TREE){give('wood');G.stats.wood++;floatT(cx,cy-6,'+1 '+nm('wood'),'#e8d0a0')}
 else{give('stone');floatT(cx,cy-6,'+1 '+nm('stone'),'#d0d0d8');const b=biome(tx,ty);if(b!=='plain'&&Math.random()<.12){give('crystal');floatT(cx,cy-14,'+1 '+nm('crystal'),'#b9a0ff')}}
 if(hp<=0){delete G.thp[i];if(c===T.TREE){G.map[i]=T.STUMP;give('wood',2);G.stats.wood+=2}else G.map[i]=T.GRASS}
}
function damageP(amt,src){
 const p=P();if(p.dead>0||p.hurtT>0)return;
 const night=isNight()?1.25:1;let d=Math.max(1,Math.round(amt*night*diffMul()*rnd(.85,1.15))-defP());
 p.hurtT=.45;SND.hurt();if(S.shake)G.shake=.15;floatT(p.x,p.y-18,'-'+d,'#ff7a6a');
 if(src){const a=Math.atan2(p.y-src.y,p.x-src.x);moveE(p,Math.cos(a)*6,Math.sin(a)*6,p.body&&MON[p.body.kind].fly)}
 if(p.body){p.body.hp-=d;if(p.body.hp<=0){soulReturn(true)}return}
 p.hp-=d;if(p.hp<=0){p.hp=0;p.dead=1.6;toast(t('died'),'bad')}
}
function respawn(){const p=P();const f=G.buildings.find(b=>b.k==='campfire');p.x=f?f.cx:(VX+.5)*TS;p.y=f?f.cy+18:(VY+3)*TS;p.hp=maxHp();p.gold=Math.floor(p.gold*.8);p.hurtT=1.5}

// ================= Âme =================
function soulAction(){
 const p=P();if(p.dead>0)return;
 if(p.body){soulReturn(false);return}
 let best=null,bd=26;for(const e of G.ents){if(!MON[e.kind]||e.ally)continue;const d=dist(e,p);if(d<bd){bd=d;best=e}}
 if(!best||best.hp/best.maxhp>.35){toast(t('soulNeed'));return}
 if(MON[best.kind].boss){toast(t('soulBoss'),'bad');return}
 p.shell={x:p.x,y:p.y,dir:{...p.dir}};p.body={kind:best.kind,lvl:best.lvl,hp:Math.round(best.maxhp*.7),maxhp:best.maxhp,atk:best.atk+2};
 p.x=best.x;p.y=best.y;best.dead=true;G.stats.souls++;SND.soul();burst(p.x,p.y-8,'#9fe6ff',18);toast(t('soulIn',nm(best.kind)),'good');
}
function soulReturn(forced){
 const p=P(),b=p.body;if(!b)return;
 if(!forced){const allies=G.ents.filter(e=>e.ally&&MON[e.kind]).length;if(allies>=4)toast(t('allyFull'));else{const e=mkMon(b.kind,b.lvl,p.x,p.y,-1);e.ally=true;e.hp=Math.max(1,b.hp);G.ents.push(e)}toast(t('soulOut'),'good')}
 else{toast(t('soulForced'),'bad');p.hp=Math.max(1,p.hp-Math.round(maxHp()*.2))}
 burst(p.x,p.y-8,'#9fe6ff',14);SND.soul();p.body=null;p.x=p.shell.x;p.y=p.shell.y;p.dir=p.shell.dir;p.shell=null;p.hurtT=.8;
}

// ================= Entités =================
function damageE(e,amt,src){
 e.hp-=amt;e.hitT=.15;SND.hit();floatT(e.x,e.y-16,'-'+amt,'#fff');burst(e.x,e.y-6,'#ffd0a0',4);
 if(src){const a=Math.atan2(e.y-src.y,e.x-src.x),k=MON[e.kind]&&MON[e.kind].boss?2:7;moveE(e,Math.cos(a)*k,Math.sin(a)*k,MON[e.kind]&&MON[e.kind].fly)}
 if(e.hp<=0){
  if(e.ally||e.kind==='villager'){ // compagnon hors combat
   if(e.kind==='villager'){e.hp=e.maxhp;e.follow=false;e.x=e.hx;e.y=e.hy;toast(t('allyDown',e.name),'bad')}else{e.dead=true;toast(t('allyDown',nm(e.kind)),'bad')}return}
  kill(e)}
}
function kill(e){
 e.dead=true;const d=MON[e.kind];G.stats.kills[e.kind]=(G.stats.kills[e.kind]||0)+1;
 addXP(Math.round(d.xp*(1+.15*(e.lvl-1))));const gd=rint(d.gold[0],d.gold[1]);if(gd){give('gold',gd);floatT(e.x,e.y-22,'+'+gd+' or','#ffd76a')}
 let yo=-30;for(const[k,c]of d.drops)if(Math.random()<c){give(k);floatT(e.x,e.y+yo,'+'+nm(k),'#bfe0ff');yo-=8;SND.pick()}
 burst(e.x,e.y-6,'#dcdcdc',10);
 if(e.kind==='chef'){toast(t('chef'),'good');G.flags.chefDay=G.day}
}
function nearestHostile(o,r){let best=null,bd=r;for(const e of G.ents){if(!MON[e.kind]||e.ally||e.dead)continue;const d=dist(e,o);if(d<bd){bd=d;best=e}}return best}
function stepTo(e,tx,ty,sp,dt,fly){const a=Math.atan2(ty-e.y,tx-e.x),vx=Math.cos(a),vy=Math.sin(a);moveE(e,vx*sp*dt,vy*sp*dt,fly);e.dir=Math.abs(vx)>Math.abs(vy)?{x:Math.sign(vx),y:0}:{x:0,y:Math.sign(vy)};e.moving=true}
function wander(e,dt,sp,leash,fly){e.wt-=dt;if(e.wt<=0){e.wt=rnd(1,3);if(Math.random()<.4)e.mv={x:0,y:0};else{const a=Math.random()*6.28;e.mv={x:Math.cos(a),y:Math.sin(a)}}if(Math.hypot(e.x-e.hx,e.y-e.hy)>leash){const a=Math.atan2(e.hy-e.y,e.hx-e.x);e.mv={x:Math.cos(a),y:Math.sin(a)}}}
 e.moving=!!(e.mv.x||e.mv.y);if(e.moving){moveE(e,e.mv.x*sp*dt,e.mv.y*sp*dt,fly);e.dir=Math.abs(e.mv.x)>Math.abs(e.mv.y)?{x:Math.sign(e.mv.x),y:0}:{x:0,y:Math.sign(e.mv.y)}}}
function updateEnt(e,dt){
 if(e.kind==='tent'||e.dead)return;
 e.anim+=dt;e.hitT=Math.max(0,(e.hitT||0)-dt);e.cd=(e.cd||0)-dt;e.prov=(e.prov||0)-dt;e.moving=false;
 const p=P();
 if(e.kind==='elder'||e.kind==='trader'){e.dir={x:0,y:1};return}
 if(e.kind==='villager'){if(e.follow)allyAI(e,dt,55);else wander(e,dt,22,isNight()?16:56,false);return}
 const d=MON[e.kind],fly=!!d.fly;
 if(e.ally){allyAI(e,dt,Math.max(55,e.spd),fly);return}
 const night=isNight()?1.2:1;let tgt=null;
 if(p.dead<=0&&!friendly(e)&&dist(e,p)<d.aggro*night)tgt=p;
 else{for(const o of G.ents)if((o.ally||(o.kind==='villager'&&o.follow))&&!o.dead&&dist(o,e)<55){tgt=o;break}}
 if(tgt&&Math.hypot(e.x-e.hx,e.y-e.hy)>260&&tgt===p&&!d.boss){tgt=null}
 if(tgt){const dd=dist(e,tgt);if(dd>11)stepTo(e,tgt.x,tgt.y,e.spd*(e.prov>0?1.15:1),dt,fly);if(dd<14&&e.cd<=0){e.cd=d.boss?1.3:1;if(tgt===p)damageP(e.atk,e);else damageE(tgt,Math.max(1,Math.round(e.atk*.8)),e)}}
 else wander(e,dt,e.spd*.45,d.boss?40:90,fly);
}
function allyAI(e,dt,sp,fly){
 const p=P(),tg=nearestHostile(e,70);
 if(tg&&!friendly(tg)||tg&&tg.prov>0){const dd=dist(e,tg);if(dd>11)stepTo(e,tg.x,tg.y,sp,dt,fly);if(dd<15&&e.cd<=0){e.cd=1;damageE(tg,Math.max(1,Math.round(e.atk*rnd(.8,1.2))),e);if(tg.dead)addXP(0)}return}
 const dd=dist(e,p);if(dd>200){e.x=p.x-10;e.y=p.y;}else if(dd>26)stepTo(e,p.x,p.y,sp*(dd>80?1.5:1),dt,fly);
}
function fillSpawns(initial){
 ZONES.forEach((z,zi)=>{
  const n=G.ents.filter(e=>e.zone===zi&&!e.dead&&!e.ally).length;
  for(let i=n;i<z.cap;i++){
   for(let tries=0;tries<30;tries++){const tx=rint(z.a[0],z.a[2]),ty=rint(z.a[1],z.a[3]);
    if(zi===0&&Math.hypot(tx-VX,ty-VY)<12)continue;
    const fly=!!MON[z.kind].fly,x=tx*TS+8,y=ty*TS+12;if(!canAt(x,y,fly)||G.map[ty*MW+tx]===T.WATER)continue;
    if(!initial&&Math.hypot(x-P().x,y-P().y)<150)continue;
    G.ents.push(mkMon(z.kind,rint(z.lv[0],z.lv[1]),x,y,zi));break}
   if(!initial)break;
  }
 });
}

// ================= Bâtiments =================
function canPlace(k,tx,ty){const b=BLD[k];for(let y=ty;y<ty+b.h;y++)for(let x=tx;x<tx+b.w;x++){if(x<1||y<1||x>=MW-1||y>=MH-1)return false;const c=G.map[y*MW+x];if(c!==T.GRASS&&c!==T.FLOWER&&c!==T.PATH&&c!==T.STUMP)return false;if(G.bgrid[y*MW+x])return false;const p=P();if(p.x+4>x*TS&&p.x-4<x*TS+TS&&p.y>y*TS&&p.y-3<y*TS+TS)return false}return true}
function placeSpot(){const p=P(),b=BLD[G.placing];let tx=Math.floor((p.x+p.dir.x*14)/TS),ty=Math.floor((p.y-2+p.dir.y*14)/TS);if(p.dir.x<0)tx-=b.w-1;if(p.dir.y<0)ty-=b.h-1;if(p.dir.x!==0)ty-=b.h-1;if(p.dir.y>0&&b.w>1)tx-=0;return{tx,ty}}
function addBuilding(k,tx,ty){const b=BLD[k],o={k,tx,ty,w:b.w,h:b.h,cx:(tx+b.w/2)*TS,cy:(ty+b.h)*TS-4,cd:0};G.buildings.push(o);for(let y=ty;y<ty+b.h;y++)for(let x=tx;x<tx+b.w;x++)G.bgrid[y*MW+x]=1;return o}
function placeBuilding(){const k=G.placing,{tx,ty}=placeSpot();if(!canPlace(k,tx,ty)){toast(t('blocked'),'bad');return}if(!has(BLD[k].cost)){toast(t('notEnough'),'bad');G.placing=null;return}
 take(BLD[k].cost);const o=addBuilding(k,tx,ty);SND.build();burst(o.cx,o.cy-8,'#e8d0a0',14);toast(t('built',nm(k)),'good');
 if(k==='house'){const v=addVillager({x:o.cx,y:o.cy+12});if(v)toast(t('newVillager',v.name),'good')}
 G.placing=null}
function updateBuildings(dt){
 for(const b of G.buildings){if(b.k!=='tower')continue;b.cd-=dt;if(b.cd>0)continue;const src={x:b.cx,y:b.cy-24},tg=nearestHostile(src,95);if(tg&&!friendly(tg)){b.cd=1.2;const a=Math.atan2(tg.y-6-src.y,tg.x-src.x);G.projs.push({x:src.x,y:src.y,vx:Math.cos(a)*180,vy:Math.sin(a)*180,t:.8,dmg:6+Math.floor(P().lvl/2)})}}
 for(const pr of G.projs){pr.x+=pr.vx*dt;pr.y+=pr.vy*dt;pr.t-=dt;for(const e of G.ents){if(!MON[e.kind]||e.ally||e.dead)continue;if(Math.hypot(e.x-pr.x,e.y-6-pr.y)<7){damageE(e,pr.dmg,pr);pr.t=0;break}}}
 G.projs=G.projs.filter(p=>p.t>0);
}

// ================= Temps =================
function newDay(){
 G.day++;toast(t('newDay'));
 const farms=countB('farm'),mills=countB('mill');if(farms||mills){give('berry',farms*3);give('gold',mills*8);toast(t('harvest',farms*3,mills*8),'good')}
 const p=P();if(p.spouse){give('potion');}
 for(const e of G.ents)if(e.kind==='villager'){e.talks=0;e.gifts=0}
 for(let i=0;i<MW*MH;i++){if(G.map[i]===T.STUMP&&Math.random()<.35)G.map[i]=T.TREE;else if(G.map[i]===T.GRASS&&biome(i%MW,i/MW|0)==='plain'&&!G.bgrid[i]&&Math.random()<.004)G.map[i]=T.FLOWER}
 if(G.flags.chefDay&&G.day>=G.flags.chefDay+3&&!G.ents.some(e=>e.kind==='chef')){G.ents.push(mkMon('chef',6+Math.floor(G.day/5),30*TS+8,44*TS+8,1));G.flags.chefDay=0}
 for(let i=0;i<4;i++)fillSpawns(false);
 writeSave('auto');
}

// ================= Quêtes =================
function qProg(){const q=QDEF[G.quest];if(!q)return null;const v=q.v()-(q.d?G.qbase:0);return{v:Math.min(v,q.goal),goal:q.goal,done:v>=q.goal}}
function claimQuest(){const q=QDEF[G.quest],pr=qProg();if(!q||!pr.done)return;const rw=q.rw;for(const[k,v]of Object.entries(rw)){if(k==='xp')addXP(v);else if(v)give(k,v)}
 toast((S.lang==='fr'?'Quête terminée : ':'Quest complete: ')+QTXT[S.lang][G.quest][0],'good');SND.lvl();G.quest++;const nq=QDEF[G.quest];if(nq)G.qbase=nq.v()}

// ================= Interaction =================
function interact(){
 const p=P();if(p.dead>0)return;
 let best=null,bd=22;for(const e of G.ents){if(e.kind!=='villager'&&e.kind!=='elder'&&e.kind!=='trader')continue;const d=dist(e,p);if(d<bd){bd=d;best=e}}
 if(best){openDialog(best);return}
 // coffre de la crypte
 if(Math.hypot(G.chest.x-p.x,G.chest.y-p.y)<22){if(G.chest.open)toast(t('chestEmpty'));else{G.chest.open=true;p.relic=1;toast(t('chest'),'good');SND.lvl()}return}
 // bâtiments
 for(const b of G.buildings){if(Math.hypot(b.cx-p.x,b.cy-p.y)<30){if(b.k==='workshop'){openInv();return}if(b.k==='campfire'){if(isNight()){G.time=.27;toast(t('restDone'),'good');p.hp=maxHp()}else toast(t('restDay'));return}}}
 const tx=Math.floor((p.x+p.dir.x*12)/TS),ty=Math.floor((p.y-4+p.dir.y*12)/TS);
 for(const[x,y]of[[tx,ty],[Math.floor(p.x/TS),Math.floor((p.y-2)/TS)]]){const i=y*MW+x;if(G.map[i]===T.FLOWER){if(p.body){toast(t('cantHere'));return}G.map[i]=T.GRASS;give('berry');floatT(x*TS+8,y*TS,t('forage'),'#ffb0c0');SND.pick();return}
  if(G.map[i]===T.GATE||(G.map[i+MW]===T.GATE)){toast(gateOpen()?t('gateOpen'):t('gateLocked'),gateOpen()?'good':'bad');return}}
}

// ================= Effets =================

// ---- Actions ----
function act(a,arg){
 unlockAudio();const p=G&&P();
 switch(a){
  case'continue':{const best=['auto','1','2','3'].map(s=>[s,slotInfo(s)]).filter(x=>x[1]).sort((x,y)=>y[1].at-x[1].at)[0];if(best)loadSlot(best[0]);break}
  case'new':newGame(Math.floor(Math.random()*1e9));startPlay();break;
  case'load':openSaves(false);break;
  case'save':openSaves(true);break;
  case'saveSlot':if(writeSave(arg))toast(t('saved'),'good');else toast(t('noStorage'),'bad');openSaves(true);break;
  case'loadSlot':loadSlot(arg);break;
  case'settings':openSettings();break;
  case'controls':openControls();break;
  case'credits':openCredits();break;
  case'patreon':openPatreon();break;
  case'close':case'resume':closePanel();break;
  case'pausemenu':openPause();break;
  case'tomenu':closePanel();toTitle();break;
  case'use':if(p.inv[arg]){take({[arg]:1});const h=arg==='stew'?60:35;p.hp=Math.min(maxHp(),p.hp+h);floatT(p.x,p.y-18,'+'+h,'#8fe08a');SND.pick()}openInv();break;
  case'equip':p.mask=arg;openInv();break;
  case'unequip':p.mask=null;openInv();break;
  case'craft':{const r=RECIPES.find(x=>x.id===arg);if(r&&has(r.need)){take(r.need);if(r.once)p[r.id]=1;else give(r.id);SND.build();toast((S.lang==='fr'?'Fabriqué : ':'Crafted: ')+nm(r.id),'good')}openInv();break}
  case'build':closePanel();G.placing=arg;break;
  case'talk':{const e=dlgNpc;if(e.talks>=3){openDialog(e,t('tiredTalk'));break}e.talks++;e.aff=Math.min(100,e.aff+6);openDialog(e);break}
  case'gift':openGift(dlgNpc);break;
  case'giftItem':{const e=dlgNpc;take({[arg]:1});e.aff=Math.min(100,e.aff+GIFTS[arg]);SND.pick();openDialog(e,t('giftThanks'));break}
  case'talkback':openDialog(dlgNpc);break;
  case'follow':{const e=dlgNpc;const n=G.ents.filter(x=>x.follow).length;if(e.aff>=40&&n<2){e.follow=true;openDialog(e,t('followYes'))}else openDialog(e,t('followNo'));break}
  case'stay':{const e=dlgNpc;e.follow=false;e.x=e.hx;e.y=e.hy;openDialog(e,t('stayOk'));break}
  case'propose':{const e=dlgNpc;if(e.aff>=80&&p.inv.ring){take({ring:1});e.spouse=true;e.aff=100;p.spouse=e.name;SND.lvl();burst(e.x,e.y-16,'#ff8aa0',20);openDialog(e,t('proposeYes'))}else openDialog(e,t('proposeNeed'));break}
  case'claim':claimQuest();openDialog(dlgNpc);break;
  case'buy':if(p.gold>=15){p.gold-=15;give('potion');SND.pick()}openDialog(dlgNpc);break;
  case'sell':{const n=p.inv[arg]||0;if(n){take({[arg]:n});p.gold+=n*SELL[arg];SND.pick()}openDialog(dlgNpc);break}
  case'bye':closePanel();break;
 }
}

function serialize(){
 const p=P();let ms='';for(let i=0;i<G.map.length;i++)ms+=String.fromCharCode(65+G.map[i]);
 return{v:1,at:Date.now(),seed:G.seed,map:ms,day:G.day,time:G.time,quest:G.quest,qbase:G.qbase,stats:G.stats,flags:G.flags,chest:G.chest.open,
  player:{x:p.shell?p.shell.x:p.x,y:p.shell?p.shell.y:p.y,hp:p.hp,lvl:p.lvl,xp:p.xp,gold:p.gold,inv:p.inv,mask:p.mask,sword:p.sword,armor:p.armor,relic:p.relic,spouse:p.spouse},
  buildings:G.buildings.map(b=>[b.k,b.tx,b.ty]),
  npcs:G.ents.filter(e=>e.kind==='villager'||e.kind==='elder'||e.kind==='trader').map(e=>({kind:e.kind,name:e.name,tunic:e.tunic,hair:e.hair,x:e.x,y:e.y,hx:e.hx,hy:e.hy,aff:e.aff,talks:e.talks,follow:e.follow,spouse:e.spouse,seed:e.seed})),
  allies:G.ents.filter(e=>e.ally&&MON[e.kind]).map(e=>[e.kind,e.lvl,e.hp]),
  chefAlive:G.ents.some(e=>e.kind==='chef'&&!e.dead)};
}
function writeSave(slot){if(!G||mode!=='play'&&slot!=='auto')return false;return store.set('brumeval.save.'+slot,JSON.stringify(serialize()))}
function deserialize(d){
 const m=new Uint8Array(MW*MH);for(let i=0;i<m.length;i++)m[i]=d.map.charCodeAt(i)-65;
 G=newState(d.seed,m);Object.assign(G,{day:d.day,time:d.time,quest:d.quest,qbase:d.qbase,stats:d.stats,flags:d.flags||{}});G.chest.open=!!d.chest;
 Object.assign(G.player,d.player);
 for(const[k,tx,ty]of d.buildings)addBuilding(k,tx,ty);
 for(const n of d.npcs)addNpc(n);
 for(const[k,l,hp]of d.allies){const e=mkMon(k,l,G.player.x+rnd(-12,12),G.player.y+8,-1);e.ally=true;e.hp=hp;G.ents.push(e)}
 if(d.chefAlive)G.ents.push(mkMon('chef',6,30*TS+8,44*TS+8,1));
 G.ents.push({kind:'tent',x:28*TS,y:43*TS},{kind:'tent',x:32*TS+8,y:42*TS+8},{kind:'tent',x:31*TS,y:46*TS+6});
 fillSpawns(true);
}

function onPress(c){
 unlockAudio();
 if(mode!=='play')return;
 if(panelOpen()){
  if(c==='Escape'){panelKind==='pause'||panelKind==='dialog'||panelKind==='inv'||panelKind==='build'||panelKind==='map'?closePanel():openPause()}
  else if(/^Digit[1-9]$/.test(c)){const bs=[...$('#pbox').querySelectorAll('[data-act]:not([disabled])')];const b=bs[+c.slice(5)-1];if(b)b.click()}
  else if((c==='KeyI'||c==='Tab')&&panelKind==='inv'||c==='KeyB'&&panelKind==='build'||c==='KeyM'&&panelKind==='map')closePanel();
  return}
 if(G.placing){if(c==='Escape')G.placing=null;else if(c==='KeyE'||c==='Enter'||c==='Space')placeBuilding();return}
 switch(c){case'KeyE':interact();break;case'KeyR':soulAction();break;case'KeyB':openBuild();break;case'KeyI':case'Tab':openInv();break;case'KeyM':openMap();break;
  case'KeyH':{const p=P();const k=p.inv.potion?'potion':p.inv.stew?'stew':null;if(k&&!p.body){take({[k]:1});const h=k==='stew'?60:35;p.hp=Math.min(maxHp(),p.hp+h);floatT(p.x,p.y-18,'+'+h,'#8fe08a')}break}
  case'Escape':openPause();break}
}

});

const isTouch=matchMedia('(pointer:coarse)').matches;
(()=>{const st=$('#stick'),kn=$('#knob');let id=null,ox=0,oy=0;
 st.addEventListener('pointerdown',e=>{id=e.pointerId;st.setPointerCapture(id);const r=st.getBoundingClientRect();ox=r.left+r.width/2;oy=r.top+r.height/2;mv(e)});
 const mv=e=>{if(e.pointerId!==id)return;let dx=e.clientX-ox,dy=e.clientY-oy;const l=Math.hypot(dx,dy),m=44;if(l>m){dx*=m/l;dy*=m/l}kn.style.left=(40+dx)+'px';kn.style.top=(40+dy)+'px';touchVec.x=dx/m;touchVec.y=dy/m};
 st.addEventListener('pointermove',mv);const up=e=>{if(e.pointerId!==id)return;id=null;touchVec.x=touchVec.y=0;kn.style.left=kn.style.top='40px'};st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
 document.querySelectorAll('.tbtns [data-k]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();const k=b.dataset.k;if(k==='Space'&&!G.placing){keys.add('Space')}else onPress(k)});b.addEventListener('pointerup',()=>keys.delete('Space'));b.addEventListener('pointerleave',()=>keys.delete('Space'))})})();

function frame(ts){
 const dt=Math.min(.05,(ts-(lastTick||ts))/1000);lastTick=ts;
 if(G){
  if(mode==='play'&&!panelOpen()){
   G.time+=dt/DAYLEN;if(G.time>=1){G.time-=1;newDay()}
   updatePlayer(dt);for(const e of G.ents)updateEnt(e,dt);G.ents=G.ents.filter(e=>!e.dead||e.kind==='tent');
   updateBuildings(dt);G.spawnT-=dt;if(G.spawnT<=0){G.spawnT=25;fillSpawns(false)}
   G.shake=Math.max(0,G.shake-dt);
  }else if(mode==='title'){G.time=.62;for(const e of G.ents)if(MON[e.kind]&&!e.ally)wander(e,dt,e.spd*.4,90,!!MON[e.kind].fly),e.anim+=dt}
  updateFx(dt);render();
  if(mode==='play'){G.hudT-=dt;if(G.hudT<=0){G.hudT=.1;updateHUD()}}
 }
 requestAnimationFrame(frame);
}
function start(data){
 resize();applyLang();
 if(data&&data.save){try{deserialize(data.save);startPlay()}catch(e){toTitle()}}else toTitle();
 if(!store.set('brumeval.test','1'))toast(t('noStorage'),'bad');
 requestAnimationFrame(frame);
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)try{hot.snapshot(()=>G&&mode==='play'?{save:serialize()}:{})}catch(e){}
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data||{});
window.__brume={get G(){return G},act,onPress,keys};
})();
</script>
